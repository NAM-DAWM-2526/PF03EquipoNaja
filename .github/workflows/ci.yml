name: EquipoNaja
on:
  push:
    branches: [main, development, feature-tests, feature-code, impl-fibonacci, impl-pin]
  pull_request:
    branches: [feature-code, development, main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Run tests
        run: npm test